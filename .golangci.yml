version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # Keep diagnostics focused on correctness and actionable simplifications.
      checks: [all, '-ST*', '-QF*']
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
