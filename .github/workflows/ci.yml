name: Ink Commons CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify
        run: |
          go test -race ./...
          go vet ./...
          python -m unittest discover -s tests/macos -v
      - name: Build macOS arm64 binary
        run: |
          mkdir "$RUNNER_TEMP/ink-artifact"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags "-X ink-commons/internal/ink.BuildRevision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/ink-artifact/ink" ./cmd/ink
          cd "$RUNNER_TEMP/ink-artifact"
          test "$(./ink version)" = "$GITHUB_SHA"
          shasum -a 256 ink > SHA256SUMS
      - name: Upload deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ink-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/ink-artifact
          if-no-files-found: error
          retention-days: 30
