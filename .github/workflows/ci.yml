name: Ink Commons CI

on:
  pull_request:
  push:
    branches: [main, feat/opensource-v0.1]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Test and vet Go
        run: make test-race vet
      - name: Lint Go
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          make lint GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint"
      - name: Check sqlc generated code
        run: make sqlc-check
      - name: Build pure Go daemon and standalone adapter
        run: |
          make build
          test "$(bin/ink version)" = "$GITHUB_SHA"
          test "$(bin/ink-adapter-ccconnect --version)" = "development $GITHUB_SHA"
      - name: Check supported platforms and core dependencies
        run: |
          for pkg in ./cmd/ink ./cmd/ink-adapter-ccconnect ./internal/ink; do
            if output=$(GOOS=windows CGO_ENABLED=0 go build "$pkg" 2>&1); then
              echo "Unexpected Windows build success for $pkg"
              exit 1
            fi
            printf '%s\n' "$output"
            case "$output" in
              *'build constraints exclude all Go files'*) ;;
              *) exit 1 ;;
            esac
          done
          deps=$(go list -deps ./cmd/ink)
          if grep -i ccconnect <<< "$deps"; then
            echo 'Core CLI must not import ccconnect'
            exit 1
          fi
