name: Ink Commons CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify
        run: |
          go test -race ./...
          go vet ./...
          python -m unittest discover -s tests/macos -v
      - name: Build macOS arm64 binary
        run: |
          mkdir "$RUNNER_TEMP/ink-artifact"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false \
            -ldflags "-X ink-commons/internal/ink.BuildRevision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/ink-artifact/ink" ./cmd/ink
          cp deploy/macos/manage.py deploy/macos/runtime.py config.example.json "$RUNNER_TEMP/ink-artifact/"
          cd "$RUNNER_TEMP/ink-artifact"
          test "$(./ink version)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > REVISION
          shasum -a 256 ink manage.py runtime.py config.example.json REVISION > SHA256SUMS
      - name: Upload deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ink-darwin-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/ink-artifact
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ink-release-main
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ink-darwin-arm64-${{ github.sha }}
          path: ink-artifact
      - name: Publish deployment release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INK_RELEASE_SIGNING_KEY: ${{ secrets.INK_RELEASE_SIGNING_KEY }}
        run: |
          tip=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit superseded this build."
            exit 0
          fi
          tag="build-$GITHUB_SHA"
          draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null) || draft=missing
          case "$draft" in
            false) exit 0 ;;
            missing)
              gh release create "$tag" --target "$GITHUB_SHA" --draft \
                --title "macOS build ${GITHUB_SHA:0:12}" --notes "Apple Silicon build of $GITHUB_SHA."
              ;;
          esac
          if [[ -n "$INK_RELEASE_SIGNING_KEY" ]]; then
            key=$(mktemp)
            trap 'rm -f "$key"' EXIT
            chmod 600 "$key"
            printf '%s\n' "$INK_RELEASE_SIGNING_KEY" > "$key"
            ssh-keygen -Y sign -f "$key" -n ink-commons ink-artifact/SHA256SUMS
          fi
          unset INK_RELEASE_SIGNING_KEY
          gh release upload "$tag" ink-artifact/* --clobber
          gh release edit "$tag" --draft=false --latest
